<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os nortes do Anderson ✦</title>
<meta name="description" content="Uma pequena coleção de desejos do Anderson para o amigo secreto.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --noite: #13112b;
    --noite-2: #1d1a3f;
    --lavanda: #b9a7ff;
    --lua: #f5eeff;
    --rosa: #f0a9e6;
    --borda: rgba(185, 167, 255, .28);
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--lua);
    line-height: 1.6;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2d78 0%, transparent 55%),
      var(--noite);
    background-attachment: fixed;
    min-height: 100vh;
  }
  #estrelas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

  header { text-align: center; padding: 72px 20px 40px; max-width: 640px; margin: 0 auto; }
  .bussola { width: 86px; height: 86px; margin: 0 auto 22px; display: block; }
  .bussola .agulha { transform-origin: 50px 50px; animation: oscila 7s ease-in-out infinite; }
  @keyframes oscila { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.1;
    margin: 0 0 14px;
    letter-spacing: -.01em;
  }
  .subtitulo { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--rosa); margin: 0 0 22px; }
  .intro { margin: 0 auto; max-width: 46ch; color: #d6cbf5; }

  main { max-width: 1000px; margin: 0 auto; padding: 0 20px 80px; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 1.7rem; text-align: center; margin: 36px 0 28px; }

  #wish-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
  .card {
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--noite-2), #17143a);
    border: 1px solid var(--borda);
    border-radius: 18px;
    overflow: hidden;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--lavanda); transform: translateY(-3px); }
  .foto {
    aspect-ratio: 4 / 3;
    background: #0f0d24;
    display: grid; place-items: center;
    font-size: 2.4rem; color: var(--lavanda);
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-content { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h3 { font-family: var(--serif); font-weight: 500; font-size: 1.25rem; line-height: 1.25; margin: 0; }
  .card p { margin: 0; color: #d6cbf5; font-size: .96rem; }
  .card a {
    margin-top: auto; align-self: flex-start;
    padding: 9px 16px; border-radius: 999px;
    background: var(--lavanda); color: var(--noite);
    font-weight: 600; font-size: .92rem; text-decoration: none;
  }
  .card a:hover { background: var(--rosa); }
  .card a:focus-visible { outline: 3px solid var(--lua); outline-offset: 3px; }
  .card .sem-link { margin-top: auto; font-size: .88rem; color: var(--lavanda); font-style: italic; }

  footer { text-align: center; padding: 0 20px 48px; color: var(--lavanda); font-size: .95rem; }

  @media (prefers-reduced-motion: reduce) {
    .bussola .agulha { animation: none; }
    .card { transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<canvas id="estrelas" aria-hidden="true"></canvas>

<header>
  <svg class="bussola" viewBox="0 0 100 100" role="img" aria-label="Bússola">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#b9a7ff" stroke-width="1.5" opacity=".6"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#b9a7ff" stroke-width=".8" stroke-dasharray="2 4" opacity=".6"/>
    <g class="agulha">
      <path d="M50 10 L58 50 L50 90 L42 50 Z" fill="#f0a9e6"/>
      <path d="M50 10 L58 50 L50 50 Z" fill="#f5eeff"/>
    </g>
    <circle cx="50" cy="50" r="3.5" fill="#13112b"/>
  </svg>
  <h1>Os nortes do Anderson</h1>
  <p class="subtitulo">Pequenos desejos, grandes alegrias.</p>
  <p class="intro">Isso é apenas uma bússula para você se localizar nas infinitas possibilidades desse universo 💜</p>
</header>

<main>
  <h2>Minha lista de desejos</h2>
  <section id="wish-list" aria-label="Lista de desejos"></section>
</main>

<footer>feito com carinho e um pouquinho de magia ♡</footer>

<script>
  // Para adicionar um desejo, copie um bloco { ... } e preencha.
  // "foto" é o nome do arquivo de imagem que está na mesma pasta deste index.html.
  const desejos = [
    {
      nome: "Moletom Unlimited",
      descricao: "Tamanho M, azul",
      foto: "blusao.jpg",
      link: "https://www.lojasrenner.com.br/p/blusao-masculino-moletom-unlimited-com-capuz-e-half-ziper/-/A-931051068-br.lr?sku=931051076"
    },
    {
      nome: "Mouse gamer sem fio",
      descricao: "Na cor branca ou roxa",
      foto: "mouse.jpg",
      link: "https://www.kabum.com.br/produto/611255/mouse-gamer-sem-fio-redragon-invader-pro-rgb-10000-dpi-8-botoes-wireless-branco-m719w-rgb-pro"
    },
    {
      nome: "Relógio Anadigi Casio",
      descricao: "Quem me conhece sabe que eu sou péssimo com horas, por isso preciso de um relógio lindo para ficar em meu pulso.",
      foto: "relogio.jpg",
      link: "https://www.lojasrenner.com.br/p/relogio-anadigi-casio-aq230a7bmq/-/A-536686688-br.lr?sku=536686696"
    },
    {
      nome: "Pulseira prata ou preta",
      descricao: "Não tenho o link, Deus te ajude a achar rsrs",
      foto: "pulseira.jpg",
      link: ""
    },
    {
      nome: "Camiseta Polo Nanda Tsunami",
      descricao: "Tamanho M",
      foto: "nanda.jpg",
      link: "https://shopee.com.br/product/1459954671/58208321640?gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QACpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMc1TPTF0zl9lUk9doKYfbtNkYCBZaTm6dQ6q3WJIrnGYlyLtpSCE1-D6jy2YmlKEe_b7zxJZfI6lpwZ6fqmNpcGhlcnRleHTEdAAAAAzzd48Z0iZJNJwTvu0XAir4-KL8sj6sqPA6BGNDqpoqFk0tiFCrZI0bvXuX88VSscsFb89eHO5sIkRax4zZEpg9gIt254VjJo6x6Dm55IfYKXqFw-_sYdPEpLoyBAAbP4F1BuQpq2MasHxi18O8OmV5"
    },
    {
      nome: "Camiseta Marina Sena Coisas Naturais",
      descricao: "Tamanho M",
      foto: "marina.jpg",
      link: "https://shopee.com.br/-Camiseta-Premium-em-Algod%C3%A3o-Puro-TT-Camiseta-Oversized-Marina-Sena-Coisas-Naturais-Tour-Moda-Tend%C3%AAncia-100-Algod%C3%A3o-i.1615546910.58201855754?extraParams=%7B%22display_model_id%22%3A239433973977%2C%22model_selection_logic%22%3A3%7D&image_ids=sg-11134201-822x3-mi2wk3d2ploh41"
    },
    {
      nome: "Moletom com capuz casual",
      descricao: "Tamanho M",
      foto: "moletom.jpg",
      link: "https://br.shein.com/-pureWay-Manfinity-Streetrush-Men-s-Street-Style-Grey-Baggy-Thermal-Lined-Zip-Up-Hoodie-Autumn-Back-To-School-Graduation-Gift-Double-Pocket-Casual-Sweatshirt-p-146400093.html?imgRatio=3-4&detailBusinessFrom=0-1_146400093%7C0-2&src_identifier=st%3D2%60sc%3D146400093%60sr%3D0%60ps%3D1&src_module=search&src_tab_page_id=page_search1794188694169&mallCode=1&pageListType=4"
    }
  ];

  const lista = document.getElementById("wish-list");

  desejos.forEach((desejo) => {
    const card = document.createElement("article");
    card.className = "card";

    const foto = document.createElement("div");
    foto.className = "foto";
    const imagem = document.createElement("img");
    imagem.src = "imagens/" + desejo.foto;
    imagem.alt = desejo.nome;
    imagem.loading = "lazy";
    // Se a imagem não carregar, mostra uma estrelinha no lugar.
    imagem.onerror = () => { foto.textContent = "✦"; };
    foto.appendChild(imagem);

    const conteudo = document.createElement("div");
    conteudo.className = "card-content";

    const titulo = document.createElement("h3");
    titulo.textContent = desejo.nome;

    const descricao = document.createElement("p");
    descricao.textContent = desejo.descricao || "";

    conteudo.append(titulo, descricao);

    if (desejo.link) {
      const link = document.createElement("a");
      link.href = desejo.link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Ver ideia do presente";
      conteudo.appendChild(link);
    } else {
      const aviso = document.createElement("span");
      aviso.className = "sem-link";
      aviso.textContent = "Sem link, vale a criatividade";
      conteudo.appendChild(aviso);
    }

    card.append(foto, conteudo);
    lista.appendChild(card);
  });

  // Céu estrelado de fundo
  (function () {
    const canvas = document.getElementById("estrelas");
    const ctx = canvas.getContext("2d");
    let pontos = [];
    function desenhar() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const total = Math.floor((canvas.width * canvas.height) / 9000);
      pontos = Array.from({ length: total }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.3 + .3,
        a: Math.random() * .6 + .2
      }));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pontos.forEach((p) => {
        ctx.globalAlpha = p.a;
        ctx.fillStyle = "#f5eeff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    desenhar();
    window.addEventListener("resize", desenhar);
  })();
</script>
</body>
</html>
